[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "barograph"
version = "0.1.0"
description = "Universal batch runner, multi-backend export engine, and live-reloading preview server for Python plotting scripts"
readme = "README.md"
authors = [{ name = "SpanishSyntax", email = "spanishsyntax@pyritelabs.cc" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["plot", "plotting", "plotly", "matplotlib", "seaborn", "preview", "live-reload", "cli", "frost"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Utilities",
]
dependencies = [
  "prism",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
]
plotly = [
  "plotly>=5.0",
]
matplotlib = [
  "matplotlib>=3.5",
]
all = [
  "plotly>=5.0",
  "matplotlib>=3.5",
]

[project.scripts]
barograph = "barograph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["barograph*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
