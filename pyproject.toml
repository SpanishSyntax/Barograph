[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "barograph"
version = "0.1.0"
description = "Universal batch runner and multi-backend export engine for Python plotting scripts"
readme = "README.md"
authors = [{ name = "SpanishSyntax", email = "spanishsyntax@pyritelabs.cc" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["plot", "plotting", "plotly", "matplotlib", "seaborn", "cli", "frost", "export"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Utilities",
]
dependencies = [
  "prism",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
]
plotly = [
  "plotly>=5.0",
]
matplotlib = [
  "matplotlib>=3.5",
]
all = [
  "plotly>=5.0",
  "matplotlib>=3.5",
]

[project.scripts]
barograph = "barograph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["barograph*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/ui.py" = ["F401"]
"**/ui/*.py" = ["F401"]
"**/tests/*" = ["F401", "F841"]
